[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "xhs-collector"
version = "0.1.0"
description = "Standalone Xiaohongshu learning collector and Codex skill"
readme = "README.md"
requires-python = ">=3.11"
license = {file = "LICENSE"}
dependencies = ["httpx>=0.28.1,<0.29", "playwright>=1.51,<2", "xhshow>=0.2.0,<0.3"]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "PyYAML>=6,<7"]

[project.scripts]
xhs-collect = "xhs_collector.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

